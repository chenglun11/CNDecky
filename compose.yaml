services:
  cndecky:
    build: .
    image: cndecky:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CACHE_MAX_MB: ${CACHE_MAX_MB:-2048}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - cndecky-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
volumes:
  cndecky-data:
